# 共用配置（由 main.py 与 maps/{map}.yaml + qmix.yaml / mappo.yaml 合并）。
# 命令行可用 --map / --seed / --max-steps 覆盖部分字段。

# 默认地图（对应 config/maps/{map}.yaml，命令行 --map 可覆盖）
map: 3m

env_args:
  seed: 1

# Agent 网络（RNN；rnn_hidden_dim 由地图配置覆盖，这里只是兜底）
agent:
  rnn_hidden_dim: 64
  # n_actions 与 input_shape 由 main 根据环境信息自动填入

# 动作选择参数（epsilon 衰减，两个算法共用）
action_selector_args:
  epsilon_start: 1.0
  epsilon_finish: 0.05
  epsilon_anneal_time: 50000

# 观测与策略
obs_last_action: true     # 输入拼接上一时刻动作的 one-hot
obs_agent_id: true        # 输入拼接 agent id（one-hot）

# 优化器 / 训练
lr: 0.0005
optim_alpha: 0.99
optim_eps: 0.00001
gamma: 0.99
target_update_interval: 200
grad_norm_clip: 10.0
learner_log_interval: 10000

# Runner
runner: parallel           # episode -> EpisodeRunner（串行）；parallel -> ParallelRunner（并行多环境）
env: smac                 # 环境注册名（parallel_runner 用，对应 envs/REGISTRY）
batch_size_run: 5         # EpisodeRunner 必须为 1；ParallelRunner 为并行环境数
test_nepisode: 32
runner_log_interval: 10000
evaluate_interval: 10000   # 每多少 t_env 评估一次
t_max: 5000000

# Buffer（两个算法都存数据供后续使用；采样 batch_size 由 qmix.yaml 指定）
buffer_size: 5000        # ReplayBuffer 容量（episode 数）

# Checkpoint（checkpoint_path 由 qmix.yaml / mappo.yaml 各自指定，不同算法用不同目录）
save_interval: 1000      # 每 N 个 episode 保存一次
resume: true             # 启动时若存在 checkpoint 则加载

# LLM 辅助（reward shaping / action override / subgoal 规划 / 介入决策）
# 只预留接口，默认全部关闭；具体实现后续接入。
llm:
  enabled: false          # 总开关
  reward_shaping: false   # 奖励塑形
  action_override: false  # 动作覆盖
  subgoal: false          # 子目标规划
  intervene_gate: false   # 用训练数据判断是否让 LLM 介入
